name: Maven Example Build with JFrog Fly

on:
  push:
    branches: [ main, master ]
    paths:
      - 'maven-examples/maven-example/**'
      - '.github/workflows/maven-example-build.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'maven-examples/maven-example/**'
      - '.github/workflows/maven-example-build.yml'

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: fly_key
    
    defaults:
      run:
        working-directory: maven-examples/maven-example
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Setup JFrog CLI
      uses: jfrog/setup-jfrog-cli@v4
      env:
        JF_URL: https://jfmarketing.jfrog.io
        JF_ACCESS_TOKEN: ${{ secrets.FLY_SECRET }}
        
    - name: Configure Maven with JFrog Fly
      run: jf mvn-config --repo-resolve-releases=fly-maven --repo-resolve-snapshots=fly-maven --repo-deploy-releases=fly-maven-local --repo-deploy-snapshots=fly-maven-local
        
    - name: Build with Maven
      run: jf mvn clean install -B
      
    - name: Run tests
      run: mvn test
      
    - name: Package artifacts
      run: mvn package -DskipTests
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: maven-artifacts
        path: |
          maven-examples/maven-example/**/target/*.jar
          maven-examples/maven-example/**/target/*.war
        retention-days: 30

