name: Maven Example Build with JFrog Fly

on:
  push:
    branches: [ main, master ]
    paths:
      - 'maven-examples/maven-example/**'
      - '.github/workflows/maven-example-build.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'maven-examples/maven-example/**'
      - '.github/workflows/maven-example-build.yml'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., 3.7.0). Leave empty for SNAPSHOT build'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: fly_key
    
    defaults:
      run:
        working-directory: maven-examples/maven-example
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Setup JFrog Fly
      uses: jfrog/fly-action@v1
      with:
        url: https://jfmarketing.jfrog.io
        token: ${{ secrets.FLY_SECRET }}
        ignore: maven
        
    - name: Configure Maven settings for Fly
      env:
        FLY_TOKEN: ${{ secrets.FLY_SECRET }}
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
          <servers>
            <server>
              <id>fly-maven</id>
              <configuration>
                <httpHeaders>
                  <property>
                    <name>Authorization</name>
                    <value>Bearer ${FLY_TOKEN}</value>
                  </property>
                </httpHeaders>
              </configuration>
            </server>
            <server>
              <id>fly-releases</id>
              <configuration>
                <httpHeaders>
                  <property>
                    <name>Authorization</name>
                    <value>Bearer ${FLY_TOKEN}</value>
                  </property>
                </httpHeaders>
              </configuration>
            </server>
            <server>
              <id>fly-snapshots</id>
              <configuration>
                <httpHeaders>
                  <property>
                    <name>Authorization</name>
                    <value>Bearer ${FLY_TOKEN}</value>
                  </property>
                </httpHeaders>
              </configuration>
            </server>
          </servers>
        </settings>
        EOF
        echo "Maven settings.xml created with Fly authentication"
        
    - name: Set Release Version
      if: ${{ github.event.inputs.release_version != '' }}
      run: |
        echo "Setting release version to ${{ github.event.inputs.release_version }}"
        mvn versions:set -DnewVersion=${{ github.event.inputs.release_version }} -DgenerateBackupPoms=false
        
    - name: Build and Test with Maven
      run: mvn clean install -B
      
    - name: Deploy artifacts to JFrog Fly
      run: mvn deploy -DskipTests
      
    - name: Create GitHub Release
      if: ${{ github.event.inputs.release_version != '' }}
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.event.inputs.release_version }}
        release_name: Release ${{ github.event.inputs.release_version }}
        body: |
          ## Maven Example Release ${{ github.event.inputs.release_version }}
          
          **Artifacts deployed to JFrog Fly:**
          - maven-local repository
          
          **Build Information:**
          - Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Commit: ${{ github.sha }}
        draft: false
        prerelease: false
      
    - name: Upload build artifacts to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: maven-artifacts
        path: |
          maven-examples/maven-example/**/target/*.jar
          maven-examples/maven-example/**/target/*.war
        retention-days: 30

