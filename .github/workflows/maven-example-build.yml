name: Maven Example Build with JFrog Fly

on:
  push:
    branches: [ main, master ]
    paths:
      - 'maven-examples/maven-example/**'
      - '.github/workflows/maven-example-build.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'maven-examples/maven-example/**'
      - '.github/workflows/maven-example-build.yml'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., 3.7.0). Leave empty for SNAPSHOT build'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: fly_key
    
    defaults:
      run:
        working-directory: maven-examples/maven-example
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Setup JFrog CLI
      uses: jfrog/setup-jfrog-cli@v4
      env:
        JF_URL: https://jfmarketing.jfrog.io
        JF_ACCESS_TOKEN: ${{ secrets.FLY_SECRET }}
        
    - name: Configure Maven for JFrog Fly
      run: |
        jf mvn-config \
          --repo-resolve-releases=maven \
          --repo-resolve-snapshots=maven \
          --repo-deploy-releases=maven-local \
          --repo-deploy-snapshots=maven-local
        
    - name: Set Release Version
      if: ${{ github.event.inputs.release_version != '' }}
      run: |
        echo "Setting release version to ${{ github.event.inputs.release_version }}"
        jf mvn versions:set -DnewVersion=${{ github.event.inputs.release_version }} -DgenerateBackupPoms=false
        
    - name: Build and Test with Maven
      run: jf mvn clean install -B
      
    - name: Deploy artifacts to JFrog Fly
      run: jf mvn deploy -DskipTests
      
    - name: Upload build artifacts to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: maven-artifacts
        path: |
          maven-examples/maven-example/**/target/*.jar
          maven-examples/maven-example/**/target/*.war
        retention-days: 30

